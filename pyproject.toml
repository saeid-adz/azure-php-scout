[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-php-scout"
version = "0.5.0"
description = "Find potentially affected PHP services across Azure VMs, App Services and Static Web Apps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "saeid-adz"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
azure-php-scout = "azure_php_scout.cli:main"

[project.urls]
Repository = "https://github.com/saeid-adz/azure-php-scout"
Issues = "https://github.com/saeid-adz/azure-php-scout/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azure_php_scout = ["report-template.html", "web/*", "data/*.json", "data/*.csv", "scripts/*.sh", "scripts/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
